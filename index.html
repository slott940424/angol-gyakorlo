<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Angol gyakorló</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1f2937; --text:#eef1f6; --muted:#93a0b4;
    --accent:#5b8def; --good:#3ecf8e; --bad:#ef5b5b; --warn:#f0b429; --border:#2a3346;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}
  header{padding:18px 20px 10px; position:sticky; top:0; background:var(--bg); z-index:5;}
  header h1{font-size:19px; margin:0 0 2px;}
  header .sub{color:var(--muted); font-size:13px;}
  main{flex:1; padding:12px 16px 24px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tile{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 14px; text-align:center; cursor:pointer; transition:transform .1s, background .15s;}
  .tile:active{transform:scale(.97); background:var(--panel2);}
  .tile .emoji{font-size:26px; display:block; margin-bottom:8px;}
  .tile .label{font-weight:600; font-size:14px;}
  .tile .count{color:var(--muted); font-size:12px; margin-top:4px;}
  .tile.exam{grid-column:1/3; background:linear-gradient(135deg,#2a2140,#1f2937); border-color:#4c3a7a;}
  button{font-family:inherit;}
  .btn{display:block; width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;}
  .btn:active{opacity:.85;}
  .btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .btn.good{background:var(--good);}
  .btn.bad{background:var(--bad);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--muted);}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .backbtn{color:var(--muted); font-size:14px; background:none; border:none; padding:6px 0;}
  .progress{height:6px; background:var(--panel2); border-radius:6px; overflow:hidden; margin-bottom:16px;}
  .progress > div{height:100%; background:var(--accent); transition:width .25s;}
  .flash{min-height:220px; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:var(--radius); background:var(--panel); border:1px solid var(--border); padding:24px; margin-bottom:16px; cursor:pointer; user-select:none;}
  .flash .word{font-size:26px; font-weight:700;}
  .flash .hint{color:var(--muted); font-size:13px; margin-top:10px;}
  .flash .example{color:var(--muted); font-size:14px; margin-top:14px; font-style:italic;}
  .tag{display:inline-block; font-size:11px; color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:3px 10px; margin-bottom:10px;}
  input[type=text]{width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:16px; margin-bottom:12px;}
  .feedback{border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px;}
  .feedback.good{background:rgba(62,207,142,.12); border:1px solid var(--good); color:var(--good);}
  .feedback.bad{background:rgba(239,91,91,.12); border:1px solid var(--bad); color:#ff9d9d;}
  .summary-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .summary-row:last-child{border-bottom:none;}
  .missed{color:var(--bad);}
  .known{color:var(--good);}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  .big{font-size:38px; font-weight:800;}
  .choices{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
  .choice{padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel2); font-size:15px; text-align:left; cursor:pointer;}
  .choice.correct{border-color:var(--good); background:rgba(62,207,142,.12);}
  .choice.wrong{border-color:var(--bad); background:rgba(239,91,91,.12);}
  footer{padding:10px 16px 18px; font-size:11px; color:var(--muted); text-align:center;}
  .banner{font-size:12px; padding:10px 14px; border-radius:10px; margin-bottom:14px; background:rgba(240,180,41,.12); border:1px solid var(--warn); color:#ffd479;}
  .hidden{display:none !important;}
  textarea{width:100%; min-height:110px; border-radius:12px; border:1px solid var(--border); background:var(--panel2); color:var(--text); padding:12px; font-size:13px; font-family:monospace;}
</style>
</head>

function normalize(s){
  return (s||"").toLowerCase().trim()
    .replace(/[.,!?;:'"()]/g,"")
    .replace(/\s+/g," ");
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function weightedVocab(){
  // alacsonyabb box -> többször szerepel a körben (gyakrabban gyakoroljuk)
  let out=[];
  VOCAB.forEach(v=>{
    const reps = v.box<=1?3 : v.box<=2?2 : 1;
    for(let i=0;i<reps;i++) out.push(v);
  });
  return shuffle(out);
}

    <div class="card">
      <div class="tag">Info</div>
      <div style="font-size:13px; color:var(--muted); line-height:1.5;">A gyakorlás a friss anyagra fókuszál, de mindig visszahoz korábbi szavakat is, hogy ne felejtsd el őket. Minden gyakorlás végén elmentjük az eredményt.</div>
    </div>
  `;
}

function topBar(title, onBack){
  return `<div class="topbar"><button class="backbtn" onclick="renderHome()">← Vissza</button><b style="font-size:14px;">${title}</b><span style="width:40px;"></span></div>`;
}

function progressBar(){
  const pct = session.queue.length? Math.round((session.index/session.queue.length)*100):0;
  return `<div class="progress"><div style="width:${pct}%"></div></div>`;
}

/* ---------- FLASHCARDS ---------- */
function startFlashcards(){
  session = { queue: weightedVocab(), index:0, correct:0, wrong:[], known:[], mode:"flashcards", flipped:false };
  renderFlashcard();
}
function renderFlashcard(){
  const el = document.getElementById("main");
  if(session.index >= session.queue.length){ return renderSummary(); }
  const item = session.queue[session.index];
  const showEn = Math.random()<0.5;
  session.current = item; session.flipped=false; session.showEn=showEn;
  el.innerHTML = `
    ${topBar("Szókártyák")}
    ${progressBar()}
    <div class="flash" id="flashcard" onclick="flipCard()">
      <div>
        <div class="tag">${item.topic}</div>
        <div class="word" id="flashWord">${showEn?item.en:item.hu}</div>
        <div class="hint" id="flashHint">Koppints a megfordításhoz</div>
      </div>
    </div>
    <div id="flashActions"></div>
  `;
}
function flipCard(){
  if(session.flipped) return;
  session.flipped = true;
  const item = session.current;
  document.getElementById("flashWord").textContent = session.showEn ? item.hu : item.en;
  document.getElementById("flashHint").innerHTML = `<div class="example">${item.ex_en}<br>${item.ex_hu}</div>`;
  document.getElementById("flashActions").innerHTML = `
    <div class="row">
      <button class="btn bad" onclick="answerFlash(false)">Nem tudtam</button>
      <button class="btn good" onclick="answerFlash(true)">Tudtam</button>
    </div>`;
}
function answerFlash(knew){
  const item = session.current;
  if(knew){ session.correct++; session.known.push(item); } else { session.wrong.push(item); }
  session.index++;
  renderFlashcard();
}

/* ---------- TRANSLATE ---------- */
function startTranslate(dir){
  session = { queue: shuffle(VOCAB), index:0, correct:0, wrong:[], known:[], mode:"translate-"+dir, dir };
  renderTranslate();
}
function renderTranslate(){
  const el = document.getElementById("main");
  if(session.index >= session.queue.length){ return renderSummary(); }
  const item = session.queue[session.index];
  session.current = item;
  const prompt = session.dir==="en-hu" ? item.en : item.hu;
  const label = session.dir==="en-hu" ? "Írd le magyarul:" : "Írd le angolul:";
  el.innerHTML = `
    ${topBar(session.dir==="en-hu" ? "Fordítás EN→HU" : "Fordítás HU→EN")}
    ${progressBar()}
    <div class="card">
      <div class="tag">${item.topic}</div>
      <div style="font-size:22px; font-weight:700; margin-bottom:6px;">${prompt}</div>
      <div class="muted" style="font-size:13px;">${label}</div>
    </div>
    <input type="text" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Válaszod...">
    <div id="feedbackBox"></div>
    <button class="btn" id="checkBtn" onclick="checkTranslate()">Ellenőrzés</button>
  `;
  document.getElementById("answerInput").focus();
  document.getElementById("answerInput").addEventListener("keydown", e=>{ if(e.key==="Enter") checkTranslate(); });
}
function checkTranslate(){
  const btn = document.getElementById("checkBtn");
  if(btn.dataset.state==="next"){ session.index++; return renderTranslate(); }
  const item = session.current;
  const input = document.getElementById("answerInput");
  const given = normalize(input.value);
  const accepted = session.dir==="en-hu" ? [item.hu] : [item.en];
  const ok = accepted.some(a=>normalize(a)===given) && given.length>0;
  input.disabled = true;
  const fb = document.getElementById("feedbackBox");
  if(ok){
    session.correct++; session.known.push(item);
    fb.innerHTML = `<div class="feedback good">✅ Helyes!</div>`;
  } else {
    session.wrong.push(item);
    fb.innerHTML = `<div class="feedback bad">❌ Helyes válasz: <b>${accepted[0]}</b></div>`;
  }
  btn.textContent = "Következő"; btn.dataset.state="next";
}

/* ---------- GRAMMAR ---------- */
function startGrammar(){
  session = { queue: shuffle(GRAMMAR), index:0, correct:0, wrong:[], known:[], mode:"grammar" };
  renderGrammar();
}
function renderGrammar(){
  const el = document.getElementById("main");
  if(session.index >= session.queue.length){ return renderSummary(); }
  const item = session.queue[session.index];
  session.current = item;
  el.innerHTML = `
    ${topBar("Nyelvtan")}
    ${progressBar()}
    <div class="card">
      <div class="tag">${item.topic}</div>
      <div style="font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.5;">${item.explanation}</div>
      <div style="font-size:17px; font-weight:600;">${item.question}</div>
    </div>
    <div class="choices" id="choicesBox">
      ${item.choices.map((c,i)=>`<div class="choice" onclick="answerGrammar(${i})">${c}</div>`).join("")}
    </div>
  `;
}
function answerGrammar(i){
  const item = session.current;
  const boxes = document.querySelectorAll("#choicesBox .choice");
  boxes.forEach((b,idx)=>{
    b.onclick=null;
    if(idx===item.correctIndex) b.classList.add("correct");
    else if(idx===i) b.classList.add("wrong");
  });
  const ok = i===item.correctIndex;
  if(ok){ session.correct++; session.known.push({en:item.topic, hu:item.topic}); }
  else { session.wrong.push({en:item.topic, hu:item.topic}); }
  const note = document.createElement("div");
  note.className = "feedback " + (ok?"good":"bad");
  note.innerHTML = (ok?"✅ ":"❌ ") + item.note;
  document.getElementById("main").appendChild(note);
  const next = document.createElement("button");
  next.className="btn"; next.textContent="Következő"; next.style.marginTop="12px";
  next.onclick = ()=>{ session.index++; renderGrammar(); };
  document.getElementById("main").appendChild(next);
}

/* ---------- EXAM ---------- */
function startExam(){
  const words = shuffle(VOCAB).slice(0, Math.min(8, VOCAB.length));
  const grammar = shuffle(GRAMMAR).slice(0, Math.min(2, GRAMMAR.length));
  session = { queue:[...words.map(w=>({type:"word",item:w})), ...grammar.map(g=>({type:"grammar",item:g}))], index:0, correct:0, wrong:[], known:[], mode:"exam" };
  session.queue = shuffle(session.queue);
  renderExamStep();
}
function renderExamStep(){
  const el = document.getElementById("main");
  if(session.index >= session.queue.length){ return renderSummary(); }
  const step = session.queue[session.index];
  session.current = step;
  if(step.type==="word"){
    const dir = Math.random()<0.5 ? "en-hu":"hu-en";
    session.dir = dir;
    const item = step.item;
    const prompt = dir==="en-hu"?item.en:item.hu;
    el.innerHTML = `
      ${topBar("🎓 Vizsga")}
      ${progressBar()}
      <div class="card"><div class="tag">Szó</div><div style="font-size:22px; font-weight:700;">${prompt}</div></div>
      <input type="text" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Válaszod...">
      <div id="feedbackBox"></div>
      <button class="btn" id="checkBtn" onclick="checkExamWord()">Ellenőrzés</button>
    `;
    document.getElementById("answerInput").focus();
    document.getElementById("answerInput").addEventListener("keydown", e=>{ if(e.key==="Enter") checkExamWord(); });
  } else {
    const item = step.item;
    el.innerHTML = `
      ${topBar("🎓 Vizsga")}
      ${progressBar()}
      <div class="card"><div class="tag">Nyelvtan</div><div style="font-size:17px; font-weight:600;">${item.question}</div></div>
      <div class="choices" id="choicesBox">${item.choices.map((c,i)=>`<div class="choice" onclick="checkExamGrammar(${i})">${c}</div>`).join("")}</div>
    `;
  }
}
function checkExamWord(){
  const btn = document.getElementById("checkBtn");
  if(btn.dataset.state==="next"){ session.index++; return renderExamStep(); }
  const item = session.current.item;
  const given = normalize(document.getElementById("answerInput").value);
  const accepted = session.dir==="en-hu" ? [item.hu] : [item.en];
  const ok = accepted.some(a=>normalize(a)===given) && given.length>0;
  document.getElementById("answerInput").disabled = true;
  document.getElementById("feedbackBox").innerHTML = ok
    ? `<div class="feedback good">✅ Helyes!</div>`
    : `<div class="feedback bad">❌ Helyes válasz: <b>${accepted[0]}</b></div>`;
  if(ok){ session.correct++; session.known.push(item); } else { session.wrong.push(item); }
  btn.textContent="Következő"; btn.dataset.state="next";
}
function checkExamGrammar(i){
  const item = session.current.item;
  const boxes = document.querySelectorAll("#choicesBox .choice");
  boxes.forEach((b,idx)=>{ b.onclick=null; if(idx===item.correctIndex) b.classList.add("correct"); else if(idx===i) b.classList.add("wrong"); });
  const ok = i===item.correctIndex;
  if(ok){ session.correct++; session.known.push({en:item.topic, hu:item.topic}); } else { session.wrong.push({en:item.topic, hu:item.topic}); }
  const next = document.createElement("button");
  next.className="btn"; next.textContent="Következő"; next.style.marginTop="12px";
  next.onclick = ()=>{ session.index++; renderExamStep(); };
  document.getElementById("main").appendChild(next);
}

/* ---------- SUMMARY + SYNC ---------- */
function renderSummary(){
  const total = session.correct + session.wrong.length;
  const pct = total? Math.round((session.correct/total)*100) : 0;
  const wrongNames = [...new Set(session.wrong.map(w=>w.en))];
  const knownNames = [...new Set(session.known.map(w=>w.en))];
  const el = document.getElementById("main");
  el.innerHTML = `
    ${topBar("Összegzés")}
    <div class="card center">
      <div class="muted" style="font-size:13px; margin-bottom:6px;">Eredmény</div>
      <div class="big">${session.correct}/${total}</div>
      <div class="muted" style="margin-top:4px;">${pct}% helyes</div>
    </div>
    <div class="card">
      <div class="summary-row"><span>Jól ment</span><span class="known">${knownNames.length? knownNames.join(", ") : "—"}</span></div>
      <div class="summary-row"><span>Nehéz volt</span><span class="missed">${wrongNames.length? wrongNames.join(", ") : "—"}</span></div>
    </div>
    <div id="syncStatus"></div>
    <button class="btn" onclick="submitResults()">Eredmény mentése</button>
    <button class="btn secondary" style="margin-top:10px;" onclick="renderHome()">Vissza a főoldalra</button>
    <div id="exportBox"></div>
  `;
}

function submitResults(){
  const total = session.correct + session.wrong.length;
  const wrongNames = [...new Set(session.wrong.map(w=>w.en))];
  const knownNames = [...new Set(session.known.map(w=>w.en))];
  const payload = {
    datetime: new Date().toISOString(),
    tipus: session.mode,
    helyes: session.correct,
    osszes: total,
    jol: knownNames.join(", "),
    rosszul: wrongNames.join(", "),
    megjegyzes: ""
  };

  // helyi biztonsági mentés (mindig)
  try{
    const log = JSON.parse(localStorage.getItem("angol_log")||"[]");
    log.push(payload);
    localStorage.setItem("angol_log", JSON.stringify(log));
  }catch(e){}

  const statusEl = document.getElementById("syncStatus");

  if(FORM_CONFIG.actionUrl){
    const fd = new FormData();
    Object.keys(FORM_CONFIG.entries).forEach(k=>{
      if(FORM_CONFIG.entries[k]) fd.append(FORM_CONFIG.entries[k], payload[k]);
    });
    fetch(FORM_CONFIG.actionUrl, { method:"POST", mode:"no-cors", body:fd })
      .then(()=>{ statusEl.innerHTML = `<div class="feedback good">☁️ Eredmény elküldve.</div>`; })
      .catch(()=>{ statusEl.innerHTML = `<div class="feedback bad">⚠️ Nem sikerült elküldeni, de mentve helyben.</div>`; showExport(payload); });
  } else {
    statusEl.innerHTML = `<div class="feedback bad">⚠️ A napló még nincs bekötve — az eredmény helyben elmentve. Exportáld és küldd el a chatben, ha szeretnéd, hogy bekerüljön az elemzésbe.</div>`;
    showExport(payload);
  }
}

function showExport(payload){
  document.getElementById("exportBox").innerHTML = `
    <div class="card" style="margin-top:12px;">
      <div class="muted" style="font-size:12px; margin-bottom:8px;">Másold ki és küldd el a chatben:</div>
      <textarea readonly onclick="this.select()">${JSON.stringify(payload)}</textarea>
    </div>`;
}

renderHome();
</script>
</body>
</html>
